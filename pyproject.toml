[build-system]
requires = ["setuptools>=78,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-meter-contracts"
version = "0.1.0"
description = "Read-only, offline validation of physical meter topology and sample quality"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML==6.0.3"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
ha-meter-contracts = "ha_meter_contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ha_meter_contracts = ["locales/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
