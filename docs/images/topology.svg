<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Physical scope: a strip is not one outlet</title><desc id="desc">One 720 W whole-strip meter covers outlets A, B and C. Their individual powers are unknown.</desc><rect width="1100" height="510" fill="white"/><g font-family="system-ui, sans-serif"><text x="36" y="44" font-size="26" fill="#172b3a" font-weight="650">Physical scope: a strip is not one outlet</text><text x="36" y="77" font-size="18" fill="#526574" font-weight="400">One meter covers every outlet below its physical scope.</text><rect x="60" y="210" width="300" height="95" rx="8" fill="#f7f9fb" stroke="#22664a" stroke-width="2"/><text x="78" y="242" font-size="20" fill="#22664a" font-weight="600">Whole-strip meter</text><text x="78" y="271" font-size="17" fill="#526574" font-weight="400">720 W total</text><path d="M360 257 L690 150" fill="none" stroke="#175f9b" stroke-width="2.5"/><rect x="690" y="110" width="345" height="85" rx="8" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="708" y="142" font-size="20" fill="#175f9b" font-weight="600">Outlet A</text><text x="708" y="171" font-size="17" fill="#526574" font-weight="400">Individual power unknown</text><path d="M360 257 L690 270" fill="none" stroke="#175f9b" stroke-width="2.5"/><rect x="690" y="230" width="345" height="85" rx="8" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="708" y="262" font-size="20" fill="#175f9b" font-weight="600">Outlet B</text><text x="708" y="291" font-size="17" fill="#526574" font-weight="400">Individual power unknown</text><path d="M360 257 L690 390" fill="none" stroke="#175f9b" stroke-width="2.5"/><rect x="690" y="350" width="345" height="85" rx="8" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="708" y="382" font-size="20" fill="#175f9b" font-weight="600">Outlet C</text><text x="708" y="411" font-size="17" fill="#526574" font-weight="400">Individual power unknown</text><text x="400" y="168" font-size="18" fill="#175f9b" font-weight="400">Covers all three</text><text x="55" y="369" font-size="19" fill="#22664a" font-weight="600">Valid claim: strip total = 720 W</text><text x="55" y="407" font-size="19" fill="#a52a2a" font-weight="600">Invalid claim: outlet A = 720 W</text><text x="55" y="440" font-size="17" fill="#526574" font-weight="400">No per-outlet values can be inferred from this total.</text><text x="36" y="486" font-size="14" fill="#526574" font-weight="400">Synthetic example · HA Meter Contracts · MIT</text></g></svg>
