<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Provenance: prevent double counting</title><desc id="desc">A direct 0.8 kW reading and an 800 W bridge reading have the same provenance. Summing them is invalid.</desc><rect width="1100" height="510" fill="white"/><g font-family="system-ui, sans-serif"><text x="36" y="44" font-size="26" fill="#172b3a" font-weight="650">Provenance: prevent double counting</text><text x="36" y="77" font-size="18" fill="#526574" font-weight="400">Different transport paths can represent the same measurement.</text><rect x="40" y="210" width="245" height="90" rx="8" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="58" y="242" font-size="20" fill="#175f9b" font-weight="600">One physical CT</text><text x="58" y="271" font-size="17" fill="#526574" font-weight="400">provenance: ct_stream_a</text><rect x="380" y="120" width="285" height="90" rx="8" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="398" y="152" font-size="20" fill="#175f9b" font-weight="600">Direct representation</text><text x="398" y="181" font-size="17" fill="#526574" font-weight="400">0.8 kW = 800 W</text><rect x="380" y="300" width="285" height="90" rx="8" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="398" y="332" font-size="20" fill="#175f9b" font-weight="600">Bridge representation</text><text x="398" y="361" font-size="17" fill="#526574" font-weight="400">800 W</text><path d="M285 255 L380 165" fill="none" stroke="#175f9b" stroke-width="2.5"/><path d="M285 255 L380 345" fill="none" stroke="#175f9b" stroke-width="2.5"/><path d="M663 165 L790 255" fill="none" stroke="#a52a2a" stroke-width="2.5"/><path d="M663 345 L790 255" fill="none" stroke="#a52a2a" stroke-width="2.5"/><rect x="790" y="210" width="265" height="90" rx="8" fill="#f7f9fb" stroke="#a52a2a" stroke-width="2"/><text x="808" y="242" font-size="20" fill="#a52a2a" font-weight="600">Do not add both</text><text x="808" y="271" font-size="17" fill="#526574" font-weight="400">1600 W is double-counted</text><text x="380" y="259" font-size="18" fill="#526574" font-weight="400">Same source, not two loads</text><text x="40" y="444" font-size="20" fill="#22664a" font-weight="400">Keep both in an inventory if useful; select one representation in a sum.</text><text x="36" y="486" font-size="14" fill="#526574" font-weight="400">Synthetic example · HA Meter Contracts · MIT</text></g></svg>
