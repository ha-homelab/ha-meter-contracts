<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Sample quality: keep the original measurement time</title><desc id="desc">At noon with a 30 second budget, an 11:59:55 sample is fresh, an 11:59:00 sample stale, and a 12:00:10 sample invalid.</desc><rect width="1100" height="510" fill="white"/><g font-family="system-ui, sans-serif"><text x="36" y="44" font-size="26" fill="#172b3a" font-weight="650">Sample quality: keep the original measurement time</text><text x="36" y="77" font-size="18" fill="#526574" font-weight="400">Synthetic UTC samples · freshness budget 30 s · evaluate at 12:00:00</text><rect x="500" y="100" width="300" height="320" fill="#edf5ef"/><path d="M800 97 L800 425" fill="none" stroke="#175f9b" stroke-width="2.5" stroke-dasharray="6 5"/><text x="36" y="156" font-size="20" fill="#22664a" font-weight="600">Fresh</text><path d="M175 150 L1000 150" fill="none" stroke="#526574" stroke-width="2.5"/><circle cx="750" cy="150" r="8" fill="#22664a"/><text x="655" y="185" font-size="17" fill="#22664a" font-weight="400">11:59:55 · age 5 s</text><text x="36" y="256" font-size="20" fill="#a52a2a" font-weight="600">Stale</text><path d="M175 250 L1000 250" fill="none" stroke="#526574" stroke-width="2.5"/><circle cx="200" cy="250" r="8" fill="#a52a2a"/><text x="180" y="285" font-size="17" fill="#a52a2a" font-weight="400">11:59:00 · age 60 s</text><text x="36" y="356" font-size="20" fill="#a52a2a" font-weight="600">Future</text><path d="M175 350 L1000 350" fill="none" stroke="#526574" stroke-width="2.5"/><circle cx="900" cy="350" r="8" fill="#a52a2a"/><text x="805" y="385" font-size="17" fill="#a52a2a" font-weight="400">12:00:10 · invalid</text><text x="500" y="116" font-size="17" fill="#22664a" font-weight="400">Accepted age window</text><text x="810" y="116" font-size="17" fill="#175f9b" font-weight="400">Evaluation</text><text x="175" y="447" font-size="19" fill="#172b3a" font-weight="400">A cache replay cannot move an old measurement into the fresh window.</text><text x="36" y="486" font-size="14" fill="#526574" font-weight="400">Synthetic example · HA Meter Contracts · MIT</text></g></svg>
